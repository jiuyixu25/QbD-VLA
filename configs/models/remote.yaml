# Client for a policy served by `qbdvla serve` (qbdvla/remote.py). The served adapter's checkpoint, dtype and
# protocol constants are read from /info at connect time.
env: null
adapter_kwargs:
  url: http://127.0.0.1:8010
  timeout: 600
notes: |
  qbdvla serve --model xvla --benchmark simpler --config '<group levels>' --port 8010       # policy environment
  qbdvla run   --model remote --model-kwargs url=http://127.0.0.1:8010 --benchmark simpler --suite google_robot_va   # simulator environment
